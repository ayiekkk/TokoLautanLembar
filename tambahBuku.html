        <h1>Tambah Buku</h1>
        <div class="form">
            <form action="">
                <div class="form-group">
                    <label for="">Nama Buku</label>
                    <input type="text" placeholder="Contoh : Fiksi">
                </div>
                <div class="form-group">
                    <label for="">Nama Penulis</label>
                    <input type="text" placeholder="Contoh : Firman">
                </div>
                <div class="form-group">
                    <label for="">Harga Buku</label>
                    <input type="number" placeholder="Contoh : 200000">
                </div>
                <div class="form-group">
                    <label for="">Stok Buku</label>
                    <input type="number" placeholder="Contoh : 10">
                </div>
                <button>Tambah</button>
            </form>
        </div>
